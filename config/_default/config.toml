[params]
    keywords = "Kleiderbügel, coat hangers, clothing storage"
    description = "Alte, schöne und fragwürdige Kleiderbügel"
    copyrightYears = "MMXXI - MMXXVI"
    cc = false
    debug = false
    useragent = "HugoBot/1.0 (https://xn--kleiderbgel-0hb.xn--blaufusstlpel-qmb.de/; User:CMahnke)"
    # "qlever": qlever.dev, avoids the 403 responses GitHub Actions runners
    # get from query.wikidata.org; "wdqs" for query.wikidata.org
    wikidatasparqlbackend = "qlever"
    schemaPerson = "https://christianmahnke.de/person.jsonld"

    [params.print]
      relative = 1

    [params.preview]
        outputPrefix = "ogPreview"
        outputSuffix = ".jpg"
        format =  "svg"
        image = "front.png"
        source = "file"
        [params.preview.size]
            height = 630
            width = 1200
        [params.preview.svg]
            template = "./Source Files/Other/preview-template.svg"
            removeMissing = true

    [params.footer]
        privacy = true

[params.webMcpSearch]
  enabled = true

[params.author]
  email = 'mail@christianmahnke.de'
  name = 'Christian Mahnke'
  uri = 'http://www.wikidata.org/entity/Q137668638'
